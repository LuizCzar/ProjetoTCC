  <div class="container" id="login">
    <div class="logo">
      <img src="img/logo/logo-comp2.png" alt="logo-comp2">
    </div>
    <div id="voltar-perfil"> </a>
    </div>

    <h2>Adicionar Projeto</h2>
    
    <form action="add_projeto.php" method="post">
      <div>
          <label for="nome">Titulo</label>
          <input type="text" id="nome" name="nome" required />
      </div>

      <div>
          <label for="link">Link</label>
          <input type="text" id="link" name="link" required />
      </div>
      <div class="row">
          <label for="habil">Habilidade principal</label>
          <select id="habil" name="habil">
            <option value="">Não informado</option>
          </select>
      </div>
      <div class="row">
        <label for="time">Equipe</label>
          <select id="time" name="time" required>
            <option value="">Não informado</option>
          </select>

        <a href="add_time.html" class="ctime">+</a>
        <dialog id="meuPopup">
          <p>Deseja mesmo apagar a equipe?</p>
          <div >
          <span id="nomeTime">Grupo 1</span>
          </div>
          <button type="button" onclick="document.getElementById('meuPopup').close()">Cancelar</button>
          <button type="button" id="apagar">Apagar</button>
        </dialog>
        <button type="button" class="rtime" id="rtime">-</button>
      </div>
      <div>
          <label for="desc">Descrição</label>
          <textarea id="desc" name="desc" placeholder="Fale um pouco sobre o projeto..." rows="4" cols="30"></textarea>
      </div>
      <button type="submit">CONFIRMAR</button>

    </form>

<script>
   
  document.getElementById("rtime").addEventListener("click", function(e){
    var id_time = document.getElementById("time").value;
    
    if (id_time === "") {
        alert("Time não selecionado");
        return;
    }
    nomeTime(id_time);
    document.getElementById('meuPopup').showModal();    
  })

  document.getElementById("apagar").addEventListener("click", function(e){
    var id_time = document.getElementById("time").value;
    console.log(id_time);
    excluirTime(id_time);
    document.getElementById("time").value = "";
    getSelect();
    document.getElementById('meuPopup').close();
  });
</script>
